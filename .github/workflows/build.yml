name: Сборки

# Зачем это здесь.
#
# Flutter не умеет собирать под Windows с Linux: для Windows-сборки нужны
# Visual Studio и Windows SDK, то есть сама Windows. Поэтому Windows-сборка
# делается здесь, на серверах GitHub: при пуше в ветку или по кнопке
# (Actions → Сборки → Run workflow) собираются все три платформы, а готовые
# архивы лежат в артефактах запуска.

on:
  push:
    branches: [master, main]
    # Пуш тега вида v1.0 публикует сборки в Releases.
    tags: ['v*']
  workflow_dispatch:

# Группа своя для каждой ветки и каждого тега: повторные пуши в один и тот же
# ref снимают предыдущий запуск, а тег и ветка друг друга не гасят. С общей
# группой пуш в ветку отменял запуск по тегу, и релиз не публиковался.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: mops-linux
            path: build/linux/x64/release/bundle
          - name: Windows
            os: windows-latest
            artifact: mops-windows
            path: build/windows/x64/runner/Release
          - name: macOS
            os: macos-latest
            artifact: mops-macos
            path: build/macos/Build/Products/Release

    steps:
      - uses: actions/checkout@v4

      # Версию фиксируем: на `stable` конвейер может взять другую сборку
      # Flutter, а проект собран под конкретную (см. flutter --version).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Версия Flutter
        run: flutter --version

      # На Linux нужны библиотеки для сборки GTK-приложения и WebKitGTK
      # (встроенный браузер для входа в аккаунт).
      - name: Зависимости Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            || true
          # Вход в браузере использует старый API libsoup — на новых Ubuntu
          # он идёт отдельным пакетом, и без него сборка падает.
          sudo apt-get install -y libsoup2.4-dev || true

      # libmpv (движок воспроизведения) есть не во всех системах: на Linux
      # её даёт пакет mpv, на Windows и macOS — соответствующие сборки.
      - name: Зависимости Linux для звука
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libmpv-dev

      - name: Зависимости macOS для звука
        if: matrix.os == 'macos-latest'
        run: brew install mpv

      # Встроенный браузер на Windows (flutter_inappwebview) собирается через
      # NuGet: он тянет пакет WebView2. Если NuGet нет в PATH, сборка падает
      # именно на этом шаге.
      - name: NuGet для сборки Windows
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          choco install nuget.commandline -y --no-progress
          nuget help | findstr /C:"NuGet Version" || echo "NuGet установлен"
        continue-on-error: true

      - name: Пакеты Dart
        run: flutter pub get

      - name: Сборка
        # Иконки лежат в перечислениях и записях, поэтому их нельзя
        # вырезать: без этого часть иконок пропадает.
        run: flutter build ${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'windows-latest' && 'windows' || 'macos' }} --release --no-tree-shake-icons

      # Установщик собирается там же, где и приложение: Inno Setup есть только
      # для Windows, в задаче релиза (она на Linux) его не запустить.
      # Установщик — дополнительный шаг: если он не соберётся (например,
      # NuGet или Inno Setup недоступны), приложение всё равно должно попасть
      # в релиз, поэтому падение здесь сборку не останавливает.
      - name: Установщик Windows
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: cmd
        run: |
          choco install innosetup -y --no-progress
          iscc /DAppVersion=${{ github.ref_name }} packaging\windows\mops.iss

      - name: Артефакт приложения
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

      - name: Артефакт установщика
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mops-installer
          path: packaging/windows/Output/*.exe
          if-no-files-found: warn

  # Публикация в Releases: только при пуше тега (v1.0 и подобных) или когда
  # запуск отмечен вручную. Иначе каждый пуш засорял бы раздел релизов.
  release:
    name: Публикация сборок
    needs: build
    # always(): даже если сборка упала, релиз надо почистить — иначе в нём
    # остаётся мусор от прошлых запусков.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      # Первым делом убираем прошлый релиз целиком: поштучное удаление файлов
      # оставляло мусор, а обновление файлов его не убирает.
      - name: Удалить прошлый релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ github.ref_name }}" -y --cleanup-tag=false || true

      # Скачиваем БЕЗ слияния: иначе файлы всех платформ попадают в одну
      # папку, и вместе с приложениями архивируются служебные каталоги
      # (data, lib) — в релиз попадал мусор.
      - name: Скачать все сборки
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false
        continue-on-error: true

      # Каждый артефакт лежит своей папкой. Приложения упаковываем в архивы
      # (Windows — zip, его система открывает сама), а установщик кладём
      # в релиз как есть.
      - name: Собрать архивы
        run: |
          cd artifacts
          for dir in mops-linux mops-windows mops-macos; do
            [ -d "$dir" ] || continue
            if [ "$dir" = "mops-windows" ]; then
              zip -qr "$dir.zip" "$dir"
            else
              tar -czf "$dir.tar.gz" "$dir"
            fi
          done
          rm -rf mops-linux mops-windows mops-macos
          echo "В релиз пойдёт:"; find . -maxdepth 2 -type f | sort

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mops-linux.tar.gz
            artifacts/mops-windows.zip
            artifacts/mops-macos.tar.gz
            artifacts/mops-installer/*.exe
          fail_on_unmatched_files: false
          generate_release_notes: true
          body: |
            ## Как запустить

            **Windows.** Скачайте `mops-setup-v*.exe` (имя с версией, поэтому
            в списке файлов ищите по маске) и запустите — установщик положит
            приложение в меню «Пуск». Либо скачайте `mops-windows.zip`,
            распакуйте в любую папку и запустите `mops.exe` (это портативный
            вариант, установка не нужна).

            **Linux.** Скачайте `mops-linux.tar.gz`, распакуйте и запустите
            `mops`. Нужен `libmpv` — он ставится пакетом `mpv`
            (`sudo pacman -S mpv` или `sudo apt install libmpv2`).

            **macOS.** Скачайте `mops-macos.tar.gz`, распакуйте и запустите
            приложение. Нужен `mpv`: `brew install mpv`.
